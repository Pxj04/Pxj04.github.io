<body>
        <h1>Lista TODO</h1>
        <label for="search">Wyszukaj zadanie</label>
        <input id="search" type="search">

        <div id="tasks"></div>
        <p id="message"></p>

        <form id="add-task">
            <label for="task-text">Nowe zadanie</label>
            <input id="task-text" type="text" minlength="3" maxlength="255" required>
            <label for="task-date">Termin (opcjonalnie)</label>
            <input id="task-date" type="datetime-local">
            <button type="submit">Dodaj zadanie</button>
        </form>
