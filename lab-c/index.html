<body>
<main>
<div id="weather-search-params">

</div>

<div id="weather-results-container">
    <section>
        <h2>Aktualna pogoda</h2>
        <div id="current-weather"></div>

        <h2>Prognoza</h2>
        <div id="forecast"></div>
    </section>
</div>
</main>
